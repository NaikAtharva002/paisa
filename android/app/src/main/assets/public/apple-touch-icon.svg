<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Rounded Rect Background with Subtle Sandstone Stroke -->
  <rect width="512" height="512" rx="128" fill="#FAF8F5"/>
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="#EDE8E0" stroke-width="16"/>
  
  <!-- Subtle Landscape Dunes in Background -->
  <path d="M0 380 Q 140 280 280 340 T 512 320 L 512 512 L 0 512 Z" fill="#87A99E" opacity="0.15"/>
  <path d="M0 420 Q 180 340 360 400 T 512 380 L 512 512 L 0 512 Z" fill="#D4952B" opacity="0.12"/>
  
  <!-- Paisa Golden Emblem Leaf -->
  <g transform="translate(64, 48) scale(8)">
    <path d="M34 16C16 20 11.8 32.34 7.64 42.68L11.42 44L13.42 39.4C14.7 40 15.6 40 16 40C38 40 44 6 44 6C42 10 28 10.5 18 12.5S4 23 4 27S7.5 34.5 7.5 34.5C14 23.5 34 16 34 16Z" fill="url(#paisa-icon-leaf-grad)"/>
