name: Build & Release Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Required for AGP 8.13+)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js Environment (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Configure Android SDK Path & Local Properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties

      - name: Copy Web Assets to Android Project
        run: npx cap copy android

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: paisa-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-android
          name: "PAISA v1.0.0 Android APK"
          body: |
            ## 📱 PAISA Android App (v1.0.0)

            Direct APK download for Android devices.

            ### File Information:
            - **App Name:** PAISA
            - **Package ID:** `money.paisa.app`
            - **Build Type:** Android Debug / Sideloadable Universal APK
            - **Target:** Android 8.0+ (API Level 24 - 34)

            ### Installation Instructions:
            1. Download the `app-debug.apk` asset below.
            2. On your Android phone, tap the downloaded `.apk` file.
            3. If prompted, allow "Install from Unknown Sources" or "Install unknown apps".
            4. Launch PAISA!
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
